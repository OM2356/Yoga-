<!-- FlowState AI Yoga Routine Assistant (Elementor HTML Widget) -->
<!-- Drop this into an Elementor "HTML" widget on your members page or portal -->
<div class="flowstate-ai-widget-card" id="flowstate-ai-chat-root">
  <style>
    .flowstate-ai-widget-card {
      max-width: 620px;
      margin: 20px auto;
      background: #ffffff;
      border: 1px solid #dce4dd;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(35, 60, 45, 0.05);
      font-family: inherit;
      color: #222a26;
      box-sizing: border-box;
    }
    .flowstate-ai-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .flowstate-ai-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--e-global-color-accent, #2d5a3f);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .flowstate-ai-title {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
      color: #17241c;
      font-family: var(--e-global-typography-primary-font-family, serif);
    }
    .flowstate-ai-subtitle {
      font-size: 12px;
      color: #5b6f61;
      margin: 2px 0 0 0;
    }
    .flowstate-safety-notice {
      background: #fff7f4;
      border: 1px solid #f6ded5;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 11px;
      color: #8c3b24;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .flowstate-chip-tray {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .flowstate-chip-btn {
      background: #f1f5f2;
      border: 1px solid #d4dfd6;
      border-radius: 16px;
      padding: 6px 12px;
      font-size: 11px;
      color: #344c3c;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .flowstate-chip-btn:hover {
      background: #e4eee6;
      border-color: #2d5a3f;
      color: #1a3623;
    }
    .flowstate-textarea {
      width: 100%;
      border: 1px solid #d2dfd5;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13px;
      color: #1f2b23;
      resize: vertical;
      min-height: 75px;
      outline: none;
      box-sizing: border-box;
      font-family: inherit;
    }
    .flowstate-textarea:focus {
      border-color: var(--e-global-color-accent, #2d5a3f);
      box-shadow: 0 0 0 3px rgba(45, 90, 63, 0.12);
    }
    .flowstate-btn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }
    .flowstate-filter-badge {
      font-size: 11px;
      color: #3b6b4c;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .flowstate-submit-btn {
      background: var(--e-global-color-accent, #2d5a3f);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .flowstate-submit-btn:hover {
      background: #1e412c;
    }
    .flowstate-submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .flowstate-result-box {
      margin-top: 20px;
      padding: 18px;
      background: #fafbfa;
      border: 1px solid #dce4dd;
      border-radius: 16px;
      display: none;
    }
    .flowstate-pose-item {
      padding: 10px 12px;
      background: #ffffff;
      border: 1px solid #e5ece6;
      border-radius: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>

  <div class="flowstate-ai-header">
    <div class="flowstate-ai-icon">✦</div>
    <div>
      <h3 class="flowstate-ai-title">AI Yoga Routine Assistant</h3>
      <p class="flowstate-ai-subtitle">Clinically contraindication-filtered personalized sequences</p>
    </div>
  </div>

  <div class="flowstate-safety-notice">
    <strong>Somatic Wellness Notice:</strong> This is a general wellness suggestion, not medical advice. If you have acute pain or injury, consult your healthcare provider.
  </div>

  <div class="flowstate-chip-tray">
    <button type="button" class="flowstate-chip-btn" data-text="I have intense tech-neck and stiff upper back from sitting at my laptop all day.">Tech-Neck & Desk Fatigue</button>
    <button type="button" class="flowstate-chip-btn" data-text="I feel anxious, chest tight, and wired, needing deep vagus nerve down-regulation.">Anxious & Overstimulated</button>
    <button type="button" class="flowstate-chip-btn" data-text="My lower back and hips feel compressed and tight after standing/sitting.">Low Back Compression</button>
    <button type="button" class="flowstate-chip-btn" data-text="I have menstrual cramping and sacral tension, need restorative gentle release.">Pelvic & Sacral Ease</button>
  </div>

  <textarea id="flowstate-ai-input" class="flowstate-textarea" placeholder="Describe how your body feels today (e.g. 15 minutes, tight hips, stressed from calls)..."></textarea>

  <div class="flowstate-btn-row">
    <div class="flowstate-filter-badge">
      <span>🛡️ Deterministic Safety Gate Active</span>
    </div>
    <button type="button" id="flowstate-ai-submit" class="flowstate-submit-btn">Curate Routine</button>
  </div>

  <div id="flowstate-ai-result" class="flowstate-result-box">
    <!-- Populated dynamically via vanilla JS fetch to /wp-json/flowstate/v1/ai-routine -->
  </div>

  <script>
    (function() {
      var btn = document.getElementById('flowstate-ai-submit');
      var input = document.getElementById('flowstate-ai-input');
      var result = document.getElementById('flowstate-ai-result');
      var chips = document.querySelectorAll('.flowstate-chip-btn');

      chips.forEach(function(chip) {
        chip.addEventListener('click', function() {
          input.value = this.getAttribute('data-text');
          submitQuery();
        });
      });

      btn.addEventListener('click', submitQuery);

      function submitQuery() {
        var text = input.value.trim();
        if (!text) return;

        btn.disabled = true;
        btn.textContent = 'Generating...';
        result.style.display = 'block';
        result.innerHTML = '<div style="font-size:12px;color:#5a6e60;">Consulting somatic AI model and running clinical contraindication filter...</div>';

        // Direct fetch to WordPress REST Route
        fetch('/wp-json/flowstate/v1/ai-routine', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-WP-Nonce': (window.wpApiSettings && window.wpApiSettings.nonce) ? window.wpApiSettings.nonce : ''
          },
          body: JSON.stringify({ prompt: text })
        })
        .then(function(res) {
          if (!res.ok) throw new Error('Please log in to your FlowState member account to use the AI Routine Assistant.');
          return res.json();
        })
        .then(function(data) {
          btn.disabled = false;
          btn.textContent = 'Curate Routine';

          if (!data || !data.routine) {
            result.innerHTML = '<div style="color:#b23522;font-size:12px;">Could not curate sequence at this moment.</div>';
            return;
          }

          var r = data.routine;
          var html = '<div style="margin-bottom:12px;">' +
            '<div style="font-size:10px;font-weight:bold;color:#2d5a3f;text-transform:uppercase;">Curated Somatic Sequence</div>' +
            '<div style="font-size:18px;font-weight:600;color:#18251e;margin-top:2px;">' + (r.title || 'Custom Somatic Flow') + '</div>' +
            '<div style="font-size:12px;color:#55695a;margin-top:2px;"><strong>Focus:</strong> ' + (r.focusArea || 'Whole Body Ease') + '</div>' +
          '</div>';

          if (data.filteredNotices && data.filteredNotices.length > 0) {
            html += '<div style="background:#eaf3ec;border:1px solid #cde3d3;border-radius:10px;padding:8px 12px;font-size:11px;color:#245435;margin-bottom:12px;">' +
              '<strong>Safety modifications:</strong> ' + data.filteredNotices.join('; ') +
            '</div>';
          }

          html += '<div style="margin-top:10px;">';
          (r.poses || []).forEach(function(p, idx) {
            html += '<div class="flowstate-pose-item">' +
              '<div>' +
                '<strong style="font-size:13px;color:#1f2a22;">' + (idx+1) + '. ' + p.name + '</strong>' +
                '<div style="font-size:11px;color:#5c7062;margin-top:2px;">' + (p.visualCue || '') + '</div>' +
              '</div>' +
              '<span style="font-size:11px;font-weight:600;color:#2d5a3f;background:#edf3ee;padding:3px 8px;border-radius:6px;white-space:nowrap;">' + (p.duration || 60) + 's</span>' +
            '</div>';
          });
          html += '</div>';

          result.innerHTML = html;
        })
        .catch(function(err) {
          btn.disabled = false;
          btn.textContent = 'Curate Routine';
          result.innerHTML = '<div style="color:#b23522;font-size:12px;background:#fdf2f0;padding:10px;border-radius:10px;">' + err.message + '</div>';
        });
      }
    })();
  </script>
</div>
